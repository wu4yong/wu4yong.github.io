<!--
  ============================================
  手机端 · 分类 / 标签文章列表页
  文件：phone/list.njk
  适用终端：手机端（路由 /phone/c/<分类>/、/phone/t/<标签>/）
  作用：手机点击首页菜单后落到的列表页，竖排文章卡片，点进 /phone/p/ 阅读
        数据由 scripts/phone-routes.js 在生成期算好（page.title / page.items）
  样式依赖：source/css/theme/phone/common.css、source/css/theme/phone/list.css
  组件依赖：phone/_components/Particles.njk
  最后修改：2026-11-11
  ============================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020817">
  <!-- 首帧兜底：浏览器默认画布是白的，样式未解析前会闪一下白。这条规则先锁死深空底色 -->
  <style>html{background-color:#020817}</style>
  <title>game - 时空秘境</title>
  <!-- 手机端样式：基础 + 列表/正文，外链引入（源文件 source/css/theme/phone/） -->
  <link rel="stylesheet" href="/css/theme/phone/common.css">
  <link rel="stylesheet" href="/css/theme/phone/list.css">
<meta name="generator" content="Hexo 8.1.2"></head>
<body>
<div class="mb-shell">
  <!--
  ============================================
  手机端星空粒子组件
  文件：Particles.njk
  适用终端：手机端
  作用：Particles.njk 的手机端副本（nunjucks 子目录 include 取不到上级）
  最后修改：2026-11-11
  ============================================
--><div id="particles" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></div>
<script src="/js/particles.min.js"></script>
<script>
particlesJS("particles", {
  particles: {
    number: {
      value: 120,
      density: {
        enable: true,
        value_area: 800
      }
    },
    color: {
      value: "#00eeff"
    },
    shape: {
      type: "circle",
      stroke: {
        width: 0,
        color: "#000000"
      }
    },
    opacity: {
      value: 0.6,
      random: true,
      anim: {
        enable: true,
        speed: 0.5,
        opacity_min: 0.1,
        sync: false
      }
    },
    size: {
      value: 3,
      random: true,
      anim: {
        enable: true,
        speed: 2,
        size_min: 0.1,
        sync: false
      }
    },
    line_linked: {
      enable: true,
      distance: 150,
      color: "#00eeff",
      opacity: 0.4,
      width: 1
    },
    move: {
      enable: true,
      speed: 0.8,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out",
      bounce: false,
      attract: {
        enable: true,
        rotateX: 600,
        rotateY: 1200
      }
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: {
        enable: true,
        mode: "grab"       // 鼠标悬停时粒子聚集
      },
      onclick: {
        enable: true,
        mode: "push"       // 点击时产生新粒子
      },
      resize: true
    },
    modes: {
      grab: {
        distance: 200,
        line_linked: {
          opacity: 1
        }
      },
      push: {
        particles_nb: 6
      }
    }
  },
  retina_detect: true
});
</script>

  <div class="mb-top">
    <a class="mb-back" href="/phone/">← 返回手机首页</a>
    <span class="mb-sub" style="margin:0">1 篇</span>
  </div>

  <h1 class="mb-title">game</h1>
  <div class="mb-sub">分类档案 · 共 1 篇，点击标题进入阅读</div>

  <div class="mb-list">
    
    <a class="mb-item" href="/phone/p/fun/game/index/">
      <span class="mb-item-title">传奇世界回忆录</span>
      <span class="mb-item-meta">2026-02-02</span>
    </a>
    
  </div>

  <div class="mb-foot">
    <a href="/phone/">返回手机首页</a>
    <a href="/phone/tags/">星迹索引</a>
  </div>
</div>
</body>
</html>
