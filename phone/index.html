/* ========== 跨页切换：新页淡入盖住旧页 ==========
   与电脑端一致：旧页留底不淡出、新页淡入，避免两层半透明叠出「闪黑」。
   手机端首帧同样已经有深色兜底，标签排序也已提前到内联脚本执行。 */
@view-transition {
  navigation: auto;
}
::view-transition-old(root) {
  animation: none;
  opacity: 1;
}
::view-transition-new(root) {
  animation: vtFadeIn 0.26s ease-out both;
}
@keyframes vtFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ========== 全站滚动条：星图风细窄滑块（信息日志同款） ==========
   Windows 默认滚动条是浅灰宽条，压在深色玻璃面板上非常突兀。
   这里统一成：轨道透明（不切面板的底色）、滑块 4px 视觉宽度的青色圆头像悬浮着，
   悬停变亮并带一点光晕。所有可滚动区域（侧栏、正文、雷达日志、标签页、弹窗列表）
   都吃这一条规则，不再各写各的。
   注意：只写 ::-webkit-*，不要混用 scrollbar-width / scrollbar-color——
   Chrome 一旦看到那两个属性就会放弃 ::-webkit 伪元素的定制，退回系统样式。 */
::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}
::-webkit-scrollbar-track {
  background: transparent;
  border: 0;
}
::-webkit-scrollbar-thumb {
  background-color: rgba(0, 238, 255, 0.42);
  /* 两侧透明边 + background-clip：12px 的轨道里只露出中间 4px，
     看起来是一条悬空的细光条，而不是贴着面板边缘的实心块 */
  border: 4px solid transparent;
  border-radius: 12px;
  background-clip: content-box;
  min-height: 36px;
  transition: background-color 0.2s ease, box-shadow 0.2s ease;
}
::-webkit-scrollbar-thumb:hover {
  background-color: rgba(0, 238, 255, 0.82);
  box-shadow: 0 0 8px rgba(0, 238, 255, 0.45);
}
::-webkit-scrollbar-thumb:active {
  background-color: rgba(0, 238, 255, 0.9);
}
::-webkit-scrollbar-corner {
  background: transparent;
}
/* 老版本 Chromium（<121）没有 background-clip 的滑块内边距，回退成 6px 实心条 */
@supports not (background-clip: content-box) {
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { border: 0; border-radius: 3px; }
}

    <script>
      /*
  ============================================
  手机端首页交互脚本
  文件：phone/_js/home-typing.js
  适用终端：手机端（/phone/ 移动入口首页）
  作用：标题打字机循环、折叠菜单展开/收起、菜单动效
  依赖：phone/_components/home-content.njk 的 .dialog / .menu 结构
  最后修改：2026-11-11
  ============================================
*/
// ===== 打字机动画（对话框内） =====
const story = "时空裂隙已开启，你降临在无垠星海之中.";
let index = 0;

function typeWriter() {
  if (index < story.length) {
    document.getElementById("storyText").innerText += story.charAt(index);
    index++;
    setTimeout(typeWriter, 60);
  }
}

setTimeout(typeWriter, 800);

// ===== 折叠/展开通用函数 =====
function setupCollapse(triggerId, submenuId, arrowId) {
  const trigger = document.getElementById(triggerId);
  const submenu = document.getElementById(submenuId);
  const arrow = document.getElementById(arrowId);
  if (!trigger || !submenu || !arrow) return;

  trigger.addEventListener("click", function (e) {
    submenu.classList.toggle("show");
    arrow.classList.toggle("rotate");
    e.preventDefault();
  });
}

// 初始化两个折叠组件
setupCollapse("techTrigger", "techSubmenu", "techArrow");
setupCollapse("funTrigger", "funSubmenu", "funArrow");

    </script>
    <script>
      /*
  ============================================
  手机端首页视差脚本
  文件：phone/_js/home-parallax.js
  适用终端：手机端（/phone/ 移动入口首页）
  作用：指针移动时的轻量视差与星空层次感
  最后修改：2026-11-11
  ============================================
*/
(function() {
  // 只在首页生效
  if (!document.querySelector('.center-box')) return;

  var centerBox = document.querySelector('.center-box');
  var dialog = document.querySelector('.dialog');
  var buttons = document.querySelectorAll('.choice-btn, .collapse-trigger, .normal-btn');

  document.addEventListener('mousemove', function(e) {
    // 计算鼠标在视口中的百分比位置 (0~1)
    var x = e.clientX / window.innerWidth;
    var y = e.clientY / window.innerHeight;

    // 中心偏移量 (-1 ~ 1)
    var moveX = (x - 0.5) * 2;
    var moveY = (y - 0.5) * 2;

    // 对话框：轻微偏移 (最大 12px)
    if (dialog) {
      dialog.style.transform = 'translate(' + (moveX * 6) + 'px, ' + (moveY * 6) + 'px)';
      dialog.style.transition = 'transform 0.1s ease-out';
    }

    // 按钮：反向偏移，产生视差 (最大 8px)
    buttons.forEach(function(btn, index) {
      var delay = index * 0.02;
      var offsetX = moveX * (4 + index * 1.5);
      var offsetY = moveY * (4 + index * 1.5);
      btn.style.transform = 'translate(' + (-offsetX) + 'px, ' + (-offsetY) + 'px)';
      btn.style.transition = 'transform 0.15s ease-out';
      btn.style.transitionDelay = delay + 's';
    });
  });

  // 鼠标离开窗口时复位
  document.addEventListener('mouseleave', function() {
    if (dialog) {
      dialog.style.transform = 'translate(0, 0)';
    }
    buttons.forEach(function(btn) {
      btn.style.transform = 'translate(0, 0)';
    });
  });

})();

    </script>

    <script>
      /* ---- 电脑端分流：PC 访问移动入口时先把人送回新电脑首页 ----
         带 ?stay=1 时不跳（方便在电脑上预览手机版） */
      (function () {
        var ua = navigator.userAgent || '';
        var isMobile = /Android|iPhone|iPod|HarmonyOS|Windows Phone|MicroMessenger|Mobile Safari/i.test(ua);
        if (!isMobile && location.search.indexOf('stay=1') < 0) {
          window.location.replace('/');
        }
      })();
    </script>
