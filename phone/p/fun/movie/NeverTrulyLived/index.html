<script>
  /* 作用：懒加载本地 mermaid 库；无 mermaid 代码块时不加载 */
  function loadLocalMermaid(){
    return new Promise(function(resolve, reject){
      if(window.mermaid) return resolve(window.mermaid);
      var s = document.createElement('script');
      s.src = '/js/third-party/mermaid/mermaid.min.js?v=10';
      s.onload = function(){ resolve(window.mermaid); };
      s.onerror = function(){ reject(new Error('mermaid local load failed')); };
      document.head.appendChild(s);
    });
  }

  /* 作用：把 ```mermaid 代码块替换成 SVG 图（手机端字号略小、图可横向滚动） */
  async function renderMermaidDiagram(){
    var blocks = document.querySelectorAll('pre[class*="language-mermaid"]');
    if(!blocks.length) return;
    var mermaid;
    try { mermaid = await loadLocalMermaid(); }
    catch(e){ console.warn('[mermaid] 本地库加载失败：', e); return; }

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        darkMode: true,
        background: 'transparent',
        fontFamily: '"Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif',
        fontSize: '12px',
        primaryColor: '#062f3d',
        primaryTextColor: '#d6f6ff',
        primaryBorderColor: '#00eeff',
        secondaryColor: '#04222d',
        tertiaryColor: '#04222d',
        mainBkg: '#062f3d',
        nodeBorder: '#00eeff',
        clusterBkg: '#02161f',
        clusterBorder: '#00eeff55',
        lineColor: '#00eeff',
        textColor: '#c0e8ff',
        edgeLabelBackground: '#02161f'
      },
      flowchart: { curve: 'basis', useMaxWidth: false, htmlLabels: false, nodeSpacing: 30, rankSpacing: 40, padding: 10 }
    });

    var targets = [];
    blocks.forEach(function(el){
      var codeEl = el.querySelector('code');
      if(!codeEl) return;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = codeEl.textContent;
      el.parentNode.replaceChild(div, el);
      targets.push(div);
    });
    if(!targets.length) return;
    try { await mermaid.run({ nodes: targets }); }
    catch(e){ console.warn('[mermaid] 渲染失败：', e); }
  }
  /* 作用：多次触发兜底（延迟重试 + DOM 变化），防止某次时机没跑到导致图表留在代码块 */
  var mmBusy = false;
  function scheduleMermaid(){
    if(mmBusy) return;
    mmBusy = true;
    renderMermaidDiagram().then(function(){ mmBusy = false; }, function(){ mmBusy = false; });
  }
  scheduleMermaid();
  window.addEventListener('load', scheduleMermaid);
  [1000, 3000, 8000].forEach(function(ms){ setTimeout(scheduleMermaid, ms); });
  if(document.readyState !== 'loading') scheduleMermaid();
  if(window.MutationObserver){
    var mmTimer = null;
    var mmObserver = new MutationObserver(function(){
      clearTimeout(mmTimer);
      mmTimer = setTimeout(scheduleMermaid, 400);
    });
    mmObserver.observe(document.querySelector('.mb-article') || document.body, { childList: true, subtree: true });
  }
</script>
