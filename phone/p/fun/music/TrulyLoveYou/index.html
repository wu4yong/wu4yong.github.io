<!--
  ============================================
  手机端 · 文章原文页
  文件：phone/post.njk
  适用终端：手机端（路由 /phone/p/<slug>/，由 scripts/phone-routes.js 生成）
  作用：手机阅读单篇文章；单列布局、无侧栏无雷达，替代电脑端 post.njk
        数据由生成期算好：page.item = { title, dateStr, content, cats, tags }
  样式依赖：source/css/theme/phone/common.css、source/css/theme/phone/list.css
  组件依赖：phone/_components/Particles.njk
  最后修改：2026-11-11
  ============================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020817">
  <!-- 首帧兜底：浏览器默认画布是白的，样式未解析前会闪一下白。这条规则先锁死深空底色 -->
  <style>html{background-color:#020817}</style>
  <title>自学吉他:真的爱你 - 时空秘境</title>
  <!-- 手机端样式：基础 + 列表/正文，外链引入（源文件 source/css/theme/phone/） -->
  <link rel="stylesheet" href="/css/theme/phone/common.css">
  <link rel="stylesheet" href="/css/theme/phone/list.css">
<meta name="generator" content="Hexo 8.1.2"></head>
<body>
<div class="mb-shell">
  <!--
  ============================================
  手机端星空粒子组件
  文件：Particles.njk
  适用终端：手机端
  作用：Particles.njk 的手机端副本（nunjucks 子目录 include 取不到上级）
        参数与电脑端 _components/Particles.njk 保持一致：
        粒子 95 / 连线 118px / opacity 0.32，外加星座层与零星闪烁层
  最后修改：2026-11-12
  ============================================
--><!-- z-index 必须是 0：负层级会被 body 不透明背景盖住，粒子在跑却看不见 -->
<div id="particles" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></div>
<!-- 星座层（与首页同一套：随机零星散布星座图形 + 偶尔闪烁的小星） -->
<div id="constellations" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;" aria-hidden="true"></div>
<script src="/js/particles.min.js"></script>
<script>
particlesJS("particles", {
  particles: {
    number: {
      value: 95,
      density: {
        enable: true,
        value_area: 800
      }
    },
    color: {
      value: "#00eeff"
    },
    shape: {
      type: "circle",
      stroke: {
        width: 0,
        color: "#000000"
      }
    },
    opacity: {
      value: 0.6,
      random: true,
      anim: {
        enable: true,
        speed: 0.5,
        opacity_min: 0.1,
        sync: false
      }
    },
    size: {
      value: 3,
      random: true,
      anim: {
        enable: true,
        speed: 2,
        size_min: 0.1,
        sync: false
      }
    },
    line_linked: {
      enable: true,
      distance: 118,
      color: "#00eeff",
      opacity: 0.32,
      width: 1
    },
    move: {
      enable: true,
      speed: 0.8,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out",
      bounce: false,
      attract: {
        enable: true,
        rotateX: 600,
        rotateY: 1200
      }
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: {
        enable: true,
        mode: "grab"       // 手指按住时粒子聚集
      },
      onclick: {
        enable: true,
        mode: "push"       // 点击时产生新粒子
      },
      resize: true
    },
    modes: {
      grab: {
        distance: 200,
        line_linked: {
          opacity: 1
        }
      },
      push: {
        particles_nb: 6
      }
    }
  },
  retina_detect: true
});
</script>
<!-- 星座 + 零星闪烁层：与电脑端共用同一份绘制脚本 -->
<script src="/js/theme/starfield.js"></script>

</html>
