<!--
  ============================================
  单标签页面模板
  文件：tag.njk
  适用终端：电脑端
  作用：某标签下文章列表；手机 UA 跳 /phone/t/<标签>/
  最后修改：2026-11-11
  ============================================
--><!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#020817">
<!-- 首帧兜底：浏览器默认画布是白的，样式未解析前会闪一下白。这条规则先锁死深空底色 -->
<style>html{background-color:#020817}</style>
<title>AICoding - 时空秘境</title>
<!-- 样式：基础层 + 标签详情页，外链引入（源文件 themes/butterfly/source/css/theme/） -->
<link rel="stylesheet" href="/css/theme/common.css">
<link rel="stylesheet" href="/css/theme/tag.css">
<script>
  /* 手机 UA 分流：电脑端这套控制台不再给手机用，直接换成手机版页面 */
  (function () {
    var ua = navigator.userAgent || '';
    if (/Android|iPhone|iPod|HarmonyOS|Windows Phone|MicroMessenger|Mobile Safari/i.test(ua)) {
      location.replace('/phone/t/untitled/');
    }
  })();
</script>
<meta name="generator" content="Hexo 8.1.2"></head>
<body>
  <!--
  ============================================
  星空粒子背景组件
  文件：Particles.njk
  适用终端：电脑端
  作用：particles.js 全站星空动画，鼠标悬停互动
  最后修改：2026-11-11
  ============================================
--><!-- z-index 必须是 0 而不是 -1：body 带着不透明的 radial-gradient 底色，
     负层级的子元素会被父元素背景整个盖住，粒子在跑但一个点都看不见 -->
<div id="particles" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></div>
<!-- 星座层：随机零星散布星座图形，叠在粒子之上、页面内容之下 -->
<div id="constellations" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none;" aria-hidden="true"></div>
<script src="/js/particles.min.js"></script>
<script>/* 本地库在仓库里，缺失时只提示、不再回退外网 CDN：
   jsdelivr 在部分网络下会长时间挂起，而它是在这里同步插入的，会阻塞后面所有脚本（含 mermaid 渲染） */
if (typeof particlesJS === "undefined") {
  console.warn("[particles] 本地 /js/particles.min.js 未加载，跳过星空背景");
}
</script>
<script>
particlesJS("particles", {
  particles: {
    number: {
      value: 95,
      density: {
        enable: true,
        value_area: 800
      }
    },
    color: {
      value: "#00eeff"
    },
    shape: {
      type: "circle",
      stroke: {
        width: 0,
        color: "#000000"
      }
    },
    opacity: {
      value: 0.6,
      random: true,
      anim: {
        enable: true,
        speed: 0.5,
        opacity_min: 0.1,
        sync: false
      }
    },
    size: {
      value: 3,
      random: true,
      anim: {
        enable: true,
        speed: 2,
        size_min: 0.1,
        sync: false
      }
    },
    line_linked: {
      enable: true,
      distance: 118,          /* 比原来 150 收紧，让粒子网络稀疏些，给星座留出视觉空间 */
      color: "#00eeff",
      opacity: 0.32,
      width: 1
    },
    move: {
      enable: true,
      speed: 0.8,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out",
      bounce: false,
      attract: {
        enable: true,
        rotateX: 600,
        rotateY: 1200
      }
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: {
        enable: true,
        mode: "grab"       // 鼠标悬停时粒子聚集
      },
      onclick: {
        enable: true,
        mode: "push"       // 点击时产生新粒子
      },
      resize: true
    },
    modes: {
      grab: {
        distance: 200,
        line_linked: {
          opacity: 1
        }
      },
      push: {
        particles_nb: 6
      }
    }
  },
  retina_detect: true
});
</script>
<!-- 星座层：独立 canvas，随机散布真实星座图形（依赖上面的 #constellations 容器） -->
