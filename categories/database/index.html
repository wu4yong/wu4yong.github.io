  ============================================
  单分类页面模板
  文件：category.njk
  适用终端：电脑端
  作用：某分类下文章列表；手机 UA 跳 /phone/c/<分类>/
  最后修改：2026-11-11
  ============================================
--><!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#020817">
  <!-- 首帧兜底：浏览器默认画布是白的，样式未解析前会闪一下白。这条规则先锁死深空底色 -->
  <style>html{background-color:#020817}</style>
  <title>database - 时空秘境</title>
  <!-- 样式：基础层 + 分类页共享，外链引入（源文件 themes/butterfly/source/css/theme/） -->
  <link rel="stylesheet" href="/css/theme/common.css">
  <link rel="stylesheet" href="/css/theme/category-shared.css">
<script>
  /* 手机 UA 分流：电脑端这套控制台不再给手机用，直接换成手机版页面 */
  (function () {
    var ua = navigator.userAgent || '';
    if (/Android|iPhone|iPod|HarmonyOS|Windows Phone|MicroMessenger|Mobile Safari/i.test(ua)) {
      location.replace('/phone/c/database/');
    }
  })();
</script>

--><div id="particles" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;"></div>

<script>/* 本地库失效时回退 CDN，保证星空背景不丢 */

}
</script>

  particles: {

        enable: true,

    color: {

    },
    shape: {
      type: "circle",
      stroke: {
        width: 0,
        color: "#000000"
      }
    },
    opacity: {
      value: 0.6,
      random: true,
      anim: {
        enable: true,
        speed: 0.5,
        opacity_min: 0.1,
        sync: false
      }
    },
    size: {
      value: 3,
      random: true,
      anim: {
        enable: true,
        speed: 2,
        size_min: 0.1,
        sync: false
      }
    },
    line_linked: {
      enable: true,
      distance: 150,
      color: "#00eeff",
      opacity: 0.4,
      width: 1
    },
    move: {
      enable: true,
      speed: 0.8,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out",
      bounce: false,
      attract: {
        enable: true,
        rotateX: 600,
        rotateY: 1200
      }
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: {
        enable: true,
        mode: "grab"       // 鼠标悬停时粒子聚集
      },
      onclick: {
        enable: true,
        mode: "push"       // 点击时产生新粒子
      },
      resize: true
    },
    modes: {
      grab: {
        distance: 200,
        line_linked: {
          opacity: 1
        }
      },
      push: {
        particles_nb: 6
      }
    }
  },
  retina_detect: true
});
</script>
