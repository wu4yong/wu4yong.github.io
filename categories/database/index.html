*//* ----- 重置所有元素边距和盒模型 ----- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
/* ----- 页面主体 ----- */
body {
  background: #020817;        /* 深空蓝背景色 */
  color: #fff;
  font-family: "Microsoft Yahei", -apple-system, BlinkMacSystemFont, sans-serif;
}
/* ----- 星空粒子容器（固定定位，全屏覆盖）----- */
#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;                 /* 置于最底层，内容在上面 */
}
/* ----- 通用内容容器（归档页、标签页等使用）----- */
.container {
  position: relative;
  z-index: 10;                /* 在粒子层之上 */
  max-width: 800px;
  margin: 0 auto;
  padding: 80px 20px;
}
/* ----- 页面头部 ----- */

/* ----- 通用返回首页按钮 ----- */

/* ----- 文章/页面列表容器（归档页使用）----- */

/* ============================================
   移动端图片和视频自适应
   ============================================ */
/* 所有图片自适应 */
.article-content img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 10px auto;
  border-radius: 8px;
}
/* 所有视频和 iframe 自适应 */
.article-content video,
.article-content iframe {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 10px auto;
  border-radius: 8px;
}
/* 视频容器 - 保持 16:9 比例 */
.video-container {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;  /* 16:9 */
  height: 0;
  overflow: hidden;
  border-radius: 8px;
  margin: 10px 0;
}
.video-container video,
.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}
/* B站 iframe 自适应 */
.article-content iframe[src*="bilibili"] {
  width: 100%;
  height: 400px;
  max-height: 50vh;
  border-radius: 8px;
}
/* ============================================
   移动端统一适配
   ============================================ */
@media (max-width: 768px) {
  .article-content iframe[src*="bilibili"] {
    height: 250px;
  }
  .article-content video,
  .article-content iframe {
    border-radius: 6px;
  }
  /* 代码块水平滚动 */
  .article-content pre,

    white-space: pre !important;
    word-break: normal !important;
    padding: 12px !important;
    font-size: 13px !important;

  }
  .article-content code {

  }
  /* 表格水平滚动 */
  .article-content table {
    display: block !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
    -webkit-overflow-scrolling: touch;
  }
  .article-content table th,
  .article-content table td {
    padding: 6px 10px;
    font-size: 12px;
  }
  .essay-image {
    height: 160px;
    font-size: 18px;
    letter-spacing: 2px;
  }
}

/* ========== 跨页切换：新页淡入盖住旧页 ==========
   静态站每点一次菜单都是重新打开一个页面，加淡入是为了「看起来像切页而不是刷新」。
   上一版重影的根因不在淡入本身，而在新页首帧还没排好标签（模板 20 个 → 脚本收成 5 个），
   两套标签在 0.2s 里叠在一起。现在排序已经下沉到 .tag-cloud 紧跟的内联脚本
   （_js/hot-tags.js），首帧就是最终 5 个，所以淡入可以安全保留。
   仍然只做「旧页留底 + 新页淡入」，不做两层同时半透明（那样中间会偏暗像闪黑）。 */
@view-transition {
  navigation: auto;
}
::view-transition-old(root) {
  animation: none;
  opacity: 1;
}
::view-transition-new(root) {
  animation: vtFadeIn 0.26s ease-out both;
}
@keyframes vtFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ========== 全站滚动条：星图风细窄滑块（信息日志同款） ==========
   Windows 默认滚动条是浅灰宽条，压在深色玻璃面板上非常突兀。
   这里统一成：轨道透明（不切面板的底色）、滑块 4px 视觉宽度的青色圆头像悬浮着，
   悬停变亮并带一点光晕。所有可滚动区域（侧栏、正文、雷达日志、标签页、弹窗列表）
   都吃这一条规则，不再各写各的。
   注意：只写 ::-webkit-*，不要混用 scrollbar-width / scrollbar-color——
   Chrome 一旦看到那两个属性就会放弃 ::-webkit 伪元素的定制，退回系统样式。 */
::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}
::-webkit-scrollbar-track {
  background: transparent;
  border: 0;
}
::-webkit-scrollbar-thumb {
  background-color: rgba(0, 238, 255, 0.42);
  /* 两侧透明边 + background-clip：12px 的轨道里只露出中间 4px，
     看起来是一条悬空的细光条，而不是贴着面板边缘的实心块 */
  border: 4px solid transparent;
  border-radius: 12px;
  background-clip: content-box;
  min-height: 36px;
  transition: background-color 0.2s ease, box-shadow 0.2s ease;
}
::-webkit-scrollbar-thumb:hover {
  background-color: rgba(0, 238, 255, 0.82);
  box-shadow: 0 0 8px rgba(0, 238, 255, 0.45);
}
::-webkit-scrollbar-thumb:active {
  background-color: rgba(0, 238, 255, 0.9);
}
::-webkit-scrollbar-corner {
  background: transparent;
}
/* 老版本 Chromium（<121）没有 background-clip 的滑块内边距，回退成 6px 实心条 */
@supports not (background-clip: content-box) {
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { border: 0; border-radius: 3px; }
}
