# 导航菜单
# ============================================================
# 实际用途：唯一消费者是 scripts/menu-order.js
#   —— 按这里的顺序决定「星迹索引 / 星图手记」左侧坐标矩阵里分类的排位，
#      也就是 starmap_menu_order() / starmap_tag_ranks() 的数据源。
# 因此本文件只保留 menu 一项。
#   particle / darkmode / background / mermaid 以及注释状态的 inject，
#   主题模板（layout、_components、phone）与 source/js 均未读取，已移除。
# ============================================================
menu:
  首页: / || fas fa-home
  技术分类:
    path: /categories/
    icon: fas fa-layer-group
    submenu:
      前端: /categories/web/ || fas fa-laptop-code
      JAVA: /categories/java/ || fas fa-coffee
      数据库: /categories/database/ || fas fa-database
      大数据: /categories/bigdata/ || fas fa-chart-line
      Netty: /categories/netty/ || fas fa-bolt
      LLM大模型: /categories/llm/ || fas fa-brain
      SpringAI: /categories/springai/ || fas fa-robot
      langchain: /categories/langchain/ || fas fa-robot
      电商问数: /categories/ecommerce/ || fas fa-cart-shopping
      深度研搜: /categories/deepsearch/ || fas fa-magnifying-glass-chart
      面试: /categories/interview/ || fas fa-user-graduate
  娱乐专区:
    path: /fun/
    icon: fas fa-dice
    submenu:
      星野歌单: /music/ || fas fa-list-ul
      音乐: /categories/music/ || fas fa-music
      电影: /categories/movie/ || fas fa-film
      摄影: /categories/photo/ || fas fa-images
      游戏: /categories/game/ || fas fa-gamepad
      随笔杂谈: /categories/essay/ || fas fa-file-lines
  网站工具:
    path: /website/
    icon: fas fa-wrench
    submenu:
      友情链接: /website/link/ || fas fa-link
  关于我: /about/ || fas fa-user-circle
