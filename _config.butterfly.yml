# 导航菜单
menu:
  首页: / || fas fa-home
  技术分类:
    path: /categories/
    icon: fas fa-layer-group
    submenu:
      随笔: /categories/archives/ || fas fa-file-lines
      前端: /categories/web/ || fas fa-laptop-code
      JAVA: /categories/java/ || fas fa-coffee
      数据库: /categories/database/ || fas fa-database
      大数据: /categories/bigdata/ || fas fa-chart-line
      Netty: /categories/netty/ || fas fa-bolt
      LLM大模型: /categories/llm/ || fas fa-clipboard-question
      SpringAI: /categories/ai/ || fas fa-clipboard-question
      电商问数: /categories/ecommerce-data-query/ || fas fa-cart-shopping
      深度研搜: /categories/deepsearch/ || fas fa-brain
      面试: /categories/interview/ || fas fa-clipboard-question
  娱乐专区:
    path: /fun/
    icon: fas fa-gamepad
    submenu:
      音乐: /fun/music/ || fas fa-music
      电影: /fun/movie/ || fas fa-film
      图片: /fun/photo/ || fas fa-images
      游戏: /fun/game/woool/ || fas fa-gamepad
  网站工具:
    path: /website/
    icon: fas fa-wrench
    submenu:
      友情链接: /website/link/ || fas fa-link
  关于我: /about/ || fas fa-user-circle

# 粒子背景
particle:
  enable: true
  color: '#00eeff'

# 深色模式
darkmode:
  enable: true
  default: dark

# 背景色
background:
  color: '#020817'

# 关闭butterfly自带mermaid，你自己模板手写按需加载
mermaid:
  enable: false

# 仅一份inject，加载依赖+底部播放器
inject:
  head:
    - <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/aplayer/1.10.1/APlayer.min.css">
    - <script src="https://cdn.bootcdn.net/ajax/libs/aplayer/1.10.1/APlayer.min.js"></script>
    - <script src="https://cdn.bootcdn.net/ajax/libs/meting/2.0.1/Meting.min.js"></script>
  bottom:
    - <div class="aplayer no-destroy" data-id="2182931917" data-server="netease" data-type="playlist" data-fixed="true" data-mini="true"></div>