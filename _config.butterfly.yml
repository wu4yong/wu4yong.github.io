# 导航菜单
# menu:
#   首页: / || fas fa-home
#   归档: /archives/ || fas fa-archive
#   标签: /tags/ || fas fa-tags
#   关于: /about/ || fas fa-user
# 菜单配置（严格遵循 YAML 缩进/格式规范）
menu:
  首页: / || fas fa-home
  技术分类: /categories/ || fas fa-layer-group || 随笔=/categories/archives/||fas fa-file-lines&&前端=/categories/web/||fas fa-laptop-code&&JAVA=/categories/java/||fas fa-coffee&&数据库=/categories/database/||fas fa-database&&大数据=/categories/bigdata/||fas fa-chart-line
  娱乐专区: /fun/ || fas fa-gamepad || 音乐=/fun/music/||fas fa-music&&电影=/fun/movie/||fas fa-film&&图片=/fun/photo/||fas fa-images&&游戏=/fun/game/woool/||fas fa-gamepad
  网站工具: /website/ || fas fa-wrench || 友情链接=/website/link/||fas fa-link
  关于我: /about/ || fas fa-user-circle
# 开启粒子背景（星空效果）
particle:
  enable: true
  color: '#00eeff'

# 深色模式
darkmode:
  enable: true
  default: dark

# 背景色
background:
  color: '#020817'
