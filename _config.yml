# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/
# Site
title: 时空秘境
subtitle: Java、JVM、MySQL、Redis、SpringAI、大数据面试笔记
description: 后端架构、JVM、中间件、分布式、Spring AI、大数据、面试复盘知识库
keywords: Java,JVM,MySQL,Redis,SpringAI,分布式,大数据,后端面试
author: wu4yong
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://wu4yong.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 渲染器：选用 prismjs，关闭 highlight，避免冲突
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
# ✅ 新增 category_map，分类页标题中文映射
category_map:
  java: java
  database: database
  bigdata: bigdata
  netty: netty
  web: web
  interview: interview
  llm: llm
  springai: springai
  ecommerce: ecommerce
  deepsearch: deepsearch
  story: story
  fun/game: game
  fun/movie: movie
  fun/music: music
  fun/photo: photo

tag_map:
  bigdata: 大数据
  database: MySQL数据库
  game: 游戏
  movie: 电影
  music: 音乐
  photo: 图片
  java: Java
  story: 随笔杂谈
  web: Web前端
  netty: Netty
  interview: 面试
  springai: SpringAI
  llm: 大模型
  ecommerce: 电商问数
  deepsearch: 深度研搜

# 核心，强制所有分类目录小写
category_generator:
  per_page: 10
  order_by: -date
  lowercase: true 

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'date'

# Pagination
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Deployment
deploy:
  type: git
  repo: git@github.com:wu4yong/wu4yong.github.io.git
  branch: develop

# 搜索配置 (hexo-generator-searchdb)
search:
  path: search.xml
  field: all
  content: true
  format: html