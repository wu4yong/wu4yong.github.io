# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/
# Site
title: 时空秘境
subtitle: Java、JVM、MySQL、Redis、SpringAI、大数据面试笔记
description: 后端架构、JVM、中间件、分布式、Spring AI、大数据、面试复盘知识库
keywords: Java,JVM,MySQL,Redis,SpringAI,分布式,大数据,后端面试
author: wu4yong
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://wu4yong.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 渲染器：选用 prismjs，关闭 highlight，避免冲突
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
# 文章分类本身已是英文目录名（java/llm/springai…），标签本身已是中文名（大模型/电商问数…），
# 因此两个映射表均无需任何条目，置空即可，避免恒等映射与命中不到的失效映射造成误导。
category_map: {}
tag_map: {}


# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# ===== 图床（文章配图唯一出口）=====
# 文章正文不再写完整 CDN 地址，统一用占位符 @@CDN@@：
#   ![说明](@@CDN@@/assets/img/java/xxx.webp)
# 构建时由 scripts/image-cdn.js 把占位符替换成下面的 base，源文件里不出现任何域名。
#
# 换图床只改这一处 base：
#   1) 换 CDN 服务商 → 改成新服务商的仓库地址（路径结构须与原图床一致）
#   2) 换图床仓库 / 分支 → 改 wu4yong/starry-images 与 @main 两段
#   3) jsDelivr 缓存没跟上 → 把 @main 换成固定 commit，如 @3fc3a98
# 注意：改完必须 hexo clean 再 generate，否则 db.json 里已渲染的旧地址不会重新替换。
image_cdn:
  # 2026-11-14：jsDelivr 在国内网络下 TLS 握手直接失败（图片全部裂图），
  # 而把 286MB 图片放回 source/ 又违反「图片不入博客仓库」的架构约定。
  #
  # 当前源 = GitHub Pages（Fastly CDN，稳定性明显优于 raw 端点）。
  # 前提条件：starry-images 仓库必须已开启 Pages
  #   Settings → Pages → Deploy from a branch → main → / (root) → Save
  # 开启后先手动验证一张：
  #   https://wu4yong.github.io/starry-images/assets/img/AICoding/1.webp
  # 返回图片（200）才部署，否则会全站裂图。
  #
  # 回滚方案（Pages 不可用 / 没开）：把下面 base 换成这条 raw 地址
  #   base: https://raw.githubusercontent.com/wu4yong/starry-images/main
  base: https://wu4yong.github.io/starry-images

# Extensions
theme: butterfly

# Deployment
deploy:
  type: git
  repo: git@github.com:wu4yong/wu4yong.github.io.git
  branch: gh-pages
  message: "deploy: auto update site"

# 搜索配置
searchdb:
  path: search.json
  field: post
  content: false
  format: html

# 分类生成器：per_page 设为 0 表示不分页。
# 原因：category.njk 一次展示该分类下全部文章（无分页 UI），若 per_page>0 会额外生成
# /categories/llm/page/2..5/ 这类与第 1 页内容完全相同的副本，属重复内容与无效产物体积。
# 注意：Hexo 没有 enable 开关可关闭内置分类生成器，写 enable 无效。
category_generator:
  per_page: 0

# 归档生成器：与分类同理，archive.njk 一次按年份展示全部记录（无分页 UI），
# per_page 设为 0 可去掉 /archives/page/2..17/ 这类内容重复的副本。
# yearly / monthly 保持 true：/archives/2026/、/archives/2026/05/ 仍照常生成，
# 它们复用同一个 archive.njk 模板，靠 page.year / page.month 过滤出对应文章。
archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false
