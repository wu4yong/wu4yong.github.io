# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 大数据学习笔记
subtitle: Hadoop/HBase 技术文档
description: 大数据HDFS、HBase、MapReduce学习笔记
keywords: bigdata,Hadoop,HBase,分布式存储
author: 你的名字
language: zh-CN  # 改为中文
timezone: Asia/Shanghai  # 东八区时间

# URL
url: https://wu4yong.gitee.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true  #开启配套资源文件夹
relative_link: true   #  开启超链接属性
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

plugins:
  - hexo-tag-video
# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
# 部署配置（正确SSH地址，复制粘贴即可）
deploy:
  type: git
  repo: git@github.com:wu4yong/wu4yong.github.io.git
  branch: master
  
# 搜索配置 (hexo-generator-searchdb)
search:
  path: search.xml
  field: all
  content: true
  format: html
# 归档生成器配置
archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  daily: false
# 标签 URL 映射
tag_map:
  bigdata: 大数据
  database: MySQL数据库
  game: 游戏
  movie: 电影
  music: 音乐
  photo: 图片
  java: Java
  story: 随笔杂谈
  web: 前端
  netty: netty
  interview: interview
  llm: llm